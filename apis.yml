name: Doos
description: >-
  Doos is a Saudi-based quick-commerce (q-commerce) platform and mobile app that
  delivers groceries, fresh produce, beauty, gifting, pharmacy, and lifestyle
  products in minutes across Saudi Arabia. Founded in 2023 by Tala Al Sahsah, it
  operates cloud/dark stores in Jeddah and Riyadh with localised assortments,
  prices, and promotions by city and delivery zone, offering a bilingual
  (Arabic/English) shopping experience. Doos is backed by 500 Global and received
  a strategic investment from Jahez to accelerate its expansion in the Kingdom's
  growing quick-commerce sector. This is a consumer-facing storefront; no public
  developer program or API has been identified at this time.
